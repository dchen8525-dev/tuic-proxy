[package]
name = "tuic-proxy-launcher"
version = "0.0.1"
edition = "2021"
description = "TUIC 代理单文件引导器"
license = "MIT"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

# Embed the app icon into the portable launcher exe (Explorer shows this one).
[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true