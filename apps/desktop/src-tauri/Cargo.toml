[package]
name = "tuic-proxy-desktop"
version = "0.0.2"
edition = "2021"
description = "PSK QUIC 代理客户端（Tauri 2 壳；代理由 tuic-proxy-client sidecar 承载）"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 链路测试：经本地 SOCKS5 访问 Cloudflare 测速端点。
reqwest = { version = "0.13", default-features = false, features = ["socks", "native-tls"] }
tokio = { version = "1", features = ["time"] }

# Used by the Unix child-process shutdown path (SIGTERM before SIGKILL).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
